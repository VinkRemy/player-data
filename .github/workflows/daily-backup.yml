
name: Daily JSON Backup

on:
  schedule:
    # Every day at 23:50 Dutch time
    - cron: '50 23 * * *'
      timezone: 'Europe/Amsterdam'

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily backup
        run: |
          DATE=$(TZ=Europe/Amsterdam date +%Y-%m-%d)
          BACKUP_DIR="backups/$DATE"

          mkdir -p "$BACKUP_DIR"

          cp -a data "$BACKUP_DIR/"
          cp -a leaderboards "$BACKUP_DIR/"
          cp -a wr-history "$BACKUP_DIR/"

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backups/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily backup $(TZ=Europe/Amsterdam date +%Y-%m-%d)"
            git push
          fi
